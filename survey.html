<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <center>
        <form style="background-color: aliceblue;" action="">
            <h1 style="background-color: aqua;">Survey form</h1>
            <p style="color: green;">Let us know how we can improvefreeCodeCamp</p>
            <label for=""> <b>Name:: </label>
            <input type="text" placeholder="Enter your Name"><br><br>
            <label for="">Email:</label>
            <input type="email" placeholder="Enter your Email"><br><br>
            <label for="">Age:</label>
            <input type="number" placeholder="Age"><br><br>
            <label for="">Which option best describes your current role? </label>

            <select name="" id="">
                
                <option value="" disabled selected>Select an option</option>
                <option value="">Student</option>
                <option value="">Employ</option>
                <option value="">Full Time Job</option>
                <option value="">Prefer not to say</option>
                
            </select><br><br>
            <label for="">How likely is that you would recommend freeCodeCamp to a friend?<br><br></label>
            
            <label for="">Definitely <input type="radio"></label>
           
            <label for="">Maybe <input type="radio"></label>
            
            <label for="">Not sure <input type="radio"></label><br><br>

            <label for="">What do you like most in FCC: </label>
            <select name="" id="">
                
                <option value="" disabled selected>Select an option</option>
                <option value="">Challenges</option>
                <option value="">Projects</option>
                <option value="">Community</option>
                
            </select>
<br><br>
            <label for="">Things that should be improved in the future (Check all that apply): <br><br></label>
            <label for="">Front-end Projects <input type="checkbox"></label>
            <label for="">Back-end Projects <input type="checkbox"></label>
            <label for="">Data Visualization <input type="checkbox"></label><br><br>
            

            <label for="">Any comments or suggestions? <br><br></label>
            <textarea name="" id="" cols="30" rows="10" placeholder="Enter your comment here..."></textarea><br><br>

            <input type="submit" value="Submit">


        </form>


    </center>
</body>

</html>
