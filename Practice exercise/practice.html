<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>
</head>
<body>
    <h1 id="greeting"></h1>
    <button>
        Click me!
    </button>



    <script>
        function personName(name) {
            
        

            let time = new Date();
            let time1 = time.getHours();
            let heading = document.querySelector('#greeting');
            
            if (time1 <= 12 && time1 >= 5) {
                heading.innerText = `Good Morning  ${name}`;            
            }
            else if (time1 <= 16) {
                heading.innerText = `Good Afternoon ${name}`;            
            }
            else if (time1 <= 19) {
                heading.innerText =`Good Evening ${name}`;            
            }
            else {
                heading.innerText =`Good Night ${name}`;
                    
            }
        }
        personName('Balajee');  

    </script>
</body>
</html>
