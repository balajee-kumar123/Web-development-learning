<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: rgb(56, 67, 56);

        }
        body{
            background-color: rgb(152, 187, 199);
            font-family: Arial, sans-serif;
        }
        h1{
            color: rgb(0, 0, 255);
            text-align: center;
            text-shadow: 0px 0px 5px rgba(0, 0, 255, 0.5);
        }
        input {
            background-color: #b8b5d6;
            border: 1px solid #ff0008;
            color: #333;
            padding: 10px;
        }
        textarea {
            background-color: #b8b5d6;
            border: 1px solid #ff0008;
            color: #333;  
        }
        

    </style>
</head>
<body>
    <h1>Google Form</h1>
    <hr>
    <p>Which course you do  ?</p>
    <textarea  name="course" id="202" placeholder="Enter your course..."></textarea>
    <hr>
    <p>What's your name ?</p>
    <textarea name="name" id="203" placeholder="Enter your name here..."></textarea>
    <hr>
    <p>What's your email ?</p>
    <textarea name="email" id="204" placeholder="Enter your email here..."></textarea>
    <hr>
    <p>What's your phone number ?</p>
    <input name="phone" id="205" placeholder="Enter your phone number here..."></input>
    <hr>
    <p>What's your Registration number ?</p>
    <input name="registration" id="206" placeholder="Enter your registration number here..."></input>
    <hr>
    <p>What's your feedback about the course ?</p>
    <textarea name="feedback" id="207" placeholder="Enter your feedback here..."></textarea><br>
    <input type="submit" value="Submit"><br>

</body>
</html>
