    let gender = prompt("Enter your gender (m and f) =");
    let age = parseInt(prompt("Enter your age ="));

    let discount = 0; // store discount percentage

    // Kids under 5 years free
    if (age <= 5) {
        discount = 100;
    }

    // Kids up to 8 years half ticket
    else if (age <= 8) {
        discount = 50;
    }

    // People over 65 years pay 30% (so 70% discount)
    if (age > 65) {
        discount = Math.max(discount, 70);
    }

    // Females get 50% off
    if (gender === 'f') {
        discount = Math.max(discount, 50);
    }

    // Final output
    if (discount > 0) {
        console.log(`Congratulations!! You got ${discount}% Discount`);
    } else {
        console.log('No Discount');
