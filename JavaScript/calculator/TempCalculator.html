<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Calculator</title>
</head>
<body>
    <script>
        function TempCal(Cel) {
            return 9/5 * Cel + 32;
        }
        console.log(TempCal(prompt('Enter Temp in Celcius: ')));
    </script>
</body>
</html>
