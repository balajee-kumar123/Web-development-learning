<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
        }
        #box {
            height: 200px;
            width: 200px;
            background-color: blueviolet;
        }
        #lock {
            height: 80px;
            width: 80px;
            background-color: aqua;
            padding: 10px 15px 10px 15px;
            margin: 100px;
            border: 2px dotted red ;
            border-radius: 40px;
        }
        #first {
            height: 100px;
            width: 100px;
            background-color: rgb(140, 114, 114);
            border: 4px solid ;
            box-sizing: border-box ;
        }
        #second {
            height: 100px;
            width: 100px;
            background-color: yellow;
            border: 4px solid ;
            box-sizing: content-box;
        }
    </style>
</head>
<body>
    <div id="box">Just obseving</div><hr>
    <button id="lock">submit</button><hr>
    <div id="first">First</div>
    <div id="second">second</div><hr><br><br><br>
    
    
    
</body>
</html>
